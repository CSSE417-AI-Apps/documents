<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8572A"/>
    </marker>
  </defs>

  <!-- "you are here" highlight behind Phase 1 -->
  <rect x="345" y="18" width="210" height="270" rx="22" fill="#FFF4EF" stroke="#E8572A" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Phase 0: vector database -->
  <g transform="translate(150,0)" fill="none" stroke="#E0A800" stroke-width="10" stroke-linecap="round">
    <ellipse cx="0" cy="55" rx="55" ry="18"/>
    <path d="M-55,55 V185 A55,18 0 0 0 55,185 V55"/>
    <path d="M-55,98 A55,18 0 0 0 55,98"/>
    <path d="M-55,141 A55,18 0 0 0 55,141"/>
  </g>

  <line x1="265" y1="120" x2="330" y2="120" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- Phase 1: a web page with a (lab) flask and a generative sparkle -->
  <g transform="translate(450,0)">
    <rect x="-80" y="42" width="160" height="150" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="8"/>
    <line x1="-80" y1="74" x2="80" y2="74" stroke="#1F2937" stroke-width="6"/>
    <circle cx="-60" cy="58" r="5" fill="#E8572A"/>
    <circle cx="-44" cy="58" r="5" fill="#E0A800"/>
    <circle cx="-28" cy="58" r="5" fill="#2BB673"/>
    <path d="M-30,148 L-44,178 H22 L8,148 Z" fill="#E8572A"/>
    <path d="M-17,86 V116 L-44,178 H22 L-5,116 V86" fill="none" stroke="#1F2937" stroke-width="6" stroke-linejoin="round"/>
    <line x1="-24" y1="86" x2="2" y2="86" stroke="#1F2937" stroke-width="6" stroke-linecap="round"/>
    <path d="M48,92 Q50,110 66,112 Q50,114 48,132 Q46,114 30,112 Q46,110 48,92 Z" fill="#E0A800"/>
    <path d="M40,140 Q41,150 50,151 Q41,152 40,162 Q39,152 30,151 Q39,150 40,140 Z" fill="#E0A800"/>
  </g>

  <line x1="565" y1="120" x2="630" y2="120" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- Phase 2: cloud with circuit lines -->
  <g transform="translate(750,0)">
    <g stroke="#2BB673" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M-40,140 V170 H-62 V188"/>
      <path d="M0,140 V196"/>
      <path d="M40,140 V165 H62 V180"/>
    </g>
    <g fill="#2BB673">
      <circle cx="-62" cy="192" r="8"/>
      <circle cx="0" cy="200" r="8"/>
      <circle cx="62" cy="184" r="8"/>
    </g>
    <g fill="#4A90E2">
      <circle cx="-48" cy="112" r="34"/>
      <circle cx="0" cy="88" r="46"/>
      <circle cx="50" cy="112" r="32"/>
      <rect x="-48" y="100" width="98" height="44" rx="10"/>
      <rect x="-82" y="112" width="164" height="32" rx="16"/>
    </g>
  </g>

  <line x1="865" y1="120" x2="925" y2="120" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- Phase 3: a pipe with data flowing through -->
  <g transform="translate(1060,0)">
    <path d="M-62,80 H52 A14,40 0 0 1 52,160 H-62 Z" fill="#E6F6F8" stroke="#1F2937" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="-62" cy="120" rx="14" ry="40" fill="#FFFFFF" stroke="#1F2937" stroke-width="7"/>
    <g stroke="#E8572A" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="-50" y1="100" x2="40" y2="100" stroke-dasharray="10 9"/>
      <line x1="-50" y1="120" x2="40" y2="120" stroke-dasharray="10 9"/>
      <line x1="-50" y1="140" x2="40" y2="140" stroke-dasharray="10 9"/>
      <line x1="70" y1="100" x2="95" y2="94"  marker-end="url(#flow)"/>
      <line x1="72" y1="120" x2="100" y2="120" marker-end="url(#flow)"/>
      <line x1="70" y1="140" x2="95" y2="146" marker-end="url(#flow)"/>
    </g>
    <g fill="#E0A800">
      <rect x="-60" y="178" width="18" height="18" rx="3"/>
      <rect x="-32" y="178" width="18" height="18" rx="3"/>
      <rect x="-4"  y="178" width="18" height="18" rx="3"/>
      <rect x="24"  y="178" width="18" height="18" rx="3"/>
    </g>
  </g>

  <!-- labels -->
  <g font-size="32" font-weight="700" text-anchor="middle">
    <text x="150"  y="262" fill="#1F2937">Phase 0</text>
    <text x="450"  y="262" fill="#E8572A">Phase 1</text>
    <text x="750"  y="262" fill="#1F2937">Phase 2</text>
    <text x="1060" y="262" fill="#1F2937">Phase 3</text>
  </g>
</svg>
