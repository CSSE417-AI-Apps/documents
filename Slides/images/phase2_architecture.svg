<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 630" width="1300" height="630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Browser -->
  <g transform="translate(130,78)">
    <rect x="-80" y="150" width="160" height="124" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="8"/>
    <line x1="-80" y1="182" x2="80" y2="182" stroke="#1F2937" stroke-width="8"/>
    <circle cx="-58" cy="166" r="5" fill="#E8572A"/>
    <circle cx="-42" cy="166" r="5" fill="#E0A800"/>
    <circle cx="-26" cy="166" r="5" fill="#2BB673"/>
    <rect x="-56" y="200" width="112" height="16" rx="8" fill="#9CA3AF"/>
    <rect x="-56" y="228" width="70" height="10" rx="5" fill="#9CA3AF"/>
    <rect x="-56" y="248" width="90" height="10" rx="5" fill="#9CA3AF"/>
  </g>
  <text x="130" y="398" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Browser</text>
  <text x="130" y="430" text-anchor="middle" font-size="22" fill="#6B7280">anyone, anywhere</text>

  <line x1="228" y1="290" x2="345" y2="290" stroke="#9CA3AF" stroke-width="8" marker-start="url(#head)" marker-end="url(#head)"/>

  <!-- Firebase Hosting (globe) -->
  <g transform="translate(430,290)">
    <circle r="64" fill="#FFF4EF" stroke="#E8572A" stroke-width="8"/>
    <ellipse rx="28" ry="64" fill="none" stroke="#E8572A" stroke-width="6"/>
    <line x1="-64" y1="0" x2="64" y2="0" stroke="#E8572A" stroke-width="6"/>
    <line x1="-55" y1="-32" x2="55" y2="-32" stroke="#E8572A" stroke-width="5"/>
    <line x1="-55" y1="32" x2="55" y2="32" stroke="#E8572A" stroke-width="5"/>
  </g>
  <text x="430" y="398" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Firebase Hosting</text>
  <text x="430" y="430" text-anchor="middle" font-size="22" fill="#6B7280" font-family="Menlo, monospace">public/</text>

  <line x1="514" y1="290" x2="645" y2="290" stroke="#9CA3AF" stroke-width="8" marker-start="url(#head)" marker-end="url(#head)"/>
  <text x="580" y="272" text-anchor="middle" font-size="20" fill="#6B7280" font-family="Menlo, monospace">/api/**</text>

  <!-- Cloud Function (Flask braces) -->
  <g transform="translate(740,78)">
    <rect x="-70" y="142" width="140" height="140" rx="24" fill="#4A90E2"/>
    <path d="M-22,170 C-44,170 -30,206 -48,212 C-30,218 -44,254 -22,254" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M22,170 C44,170 30,206 48,212 C30,218 44,254 22,254" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="740" y="398" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Cloud Function</text>
  <text x="740" y="430" text-anchor="middle" font-size="22" fill="#6B7280" font-family="Menlo, monospace">api → Flask app</text>

  <line x1="820" y1="255" x2="1035" y2="118" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>
  <line x1="822" y1="290" x2="1030" y2="290" stroke="#9CA3AF" stroke-width="8" marker-start="url(#head)" marker-end="url(#head)"/>
  <line x1="820" y1="325" x2="1035" y2="462" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- Vertex AI (network hexagon) -->
  <g transform="translate(1110,78)">
    <path d="M0,-58 L50,-29 L50,29 L0,58 L-50,29 L-50,-29 Z" fill="#1F2937"/>
    <line x1="0" y1="-26" x2="-24" y2="16" stroke="#FFFFFF" stroke-width="5"/>
    <line x1="0" y1="-26" x2="24" y2="16" stroke="#FFFFFF" stroke-width="5"/>
    <line x1="-24" y1="16" x2="24" y2="16" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="-26" r="10" fill="#E0A800"/>
    <circle cx="-24" cy="16" r="10" fill="#FFFFFF"/>
    <circle cx="24" cy="16" r="10" fill="#FFFFFF"/>
  </g>
  <text x="1110" y="172" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Vertex AI</text>
  <text x="1110" y="200" text-anchor="middle" font-size="22" fill="#6B7280">embeddings</text>

  <!-- Firestore (database) -->
  <g transform="translate(1110,205)">
    <path d="M-62,44 L-62,126 A62,20 0 0 0 62,126 L62,44" fill="#E0A800"/>
    <ellipse cx="0" cy="44" rx="62" ry="20" fill="#F2C94C"/>
    <path d="M-62,72 A62,20 0 0 0 62,72 M-62,99 A62,20 0 0 0 62,99" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <text x="1110" y="388" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Firestore</text>
  <text x="1110" y="416" text-anchor="middle" font-size="22" fill="#6B7280">data + vector search</text>

  <!-- Gemini -->
  <g transform="translate(1110,500)">
    <path d="M0,-56 C7,-13 13,-7 56,0 C13,7 7,13 0,56 C-7,13 -13,7 -56,0 C-13,-7 -7,-13 0,-56 Z" fill="#2BB673"/>
  </g>
  <text x="1110" y="590" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Gemini</text>
  <text x="1110" y="618" text-anchor="middle" font-size="22" fill="#6B7280">key in Secret Manager</text>
</svg>
