<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" width="1500" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="vecO" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8572A"/>
    </marker>
    <marker id="vecG" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0A800"/>
    </marker>
    <marker id="vecB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A90E2"/>
    </marker>
  </defs>

  <!-- highlight: this slide's stage -->
  <rect x="263" y="10" width="224" height="286" rx="22" fill="#FFF4EF" stroke="#E8572A" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 1. Discovery: RSS feed -->
  <g transform="translate(125,0)">
    <rect x="-58" y="52" width="116" height="116" rx="22" fill="#E8572A"/>
    <circle cx="-28" cy="138" r="11" fill="#FFFFFF"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
      <path d="M-28,102 A36,36 0 0 1 8,138"/>
      <path d="M-28,70 A68,68 0 0 1 40,138"/>
    </g>
  </g>

  <line x1="200" y1="112" x2="290" y2="112" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- 2. (Audio download): optional, so drawn dashed and grey -->
  <g transform="translate(375,0)">
    <rect x="-68" y="42" width="136" height="146" rx="20" fill="none" stroke="#9CA3AF" stroke-width="4" stroke-dasharray="10 8"/>
    <g stroke="#6B7280" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="62" x2="0" y2="128"/>
      <path d="M-26,104 L0,130 L26,104"/>
      <path d="M-42,130 V160 H42 V130"/>
    </g>
    <g fill="#6B7280">
      <ellipse cx="-38" cy="86" rx="9" ry="7"/>
      <rect x="-31" y="58" width="4" height="29"/>
      <path d="M-31,58 L-17,64 L-17,72 L-31,66 Z"/>
    </g>
  </g>

  <line x1="460" y1="112" x2="540" y2="112" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- 3. Transcripts: a page of timestamped lines -->
  <g transform="translate(625,0)">
    <path d="M-50,40 H22 L50,68 V188 H-50 Z" fill="#FFFFFF" stroke="#1F2937" stroke-width="7" stroke-linejoin="round"/>
    <path d="M22,40 V68 H50" fill="none" stroke="#1F2937" stroke-width="7" stroke-linejoin="round"/>
    <g stroke-width="7" stroke-linecap="round">
      <line x1="-34" y1="86"  x2="-22" y2="86"  stroke="#9CA3AF"/>
      <line x1="-10" y1="86"  x2="32"  y2="86"  stroke="#E8572A"/>
      <line x1="-34" y1="110" x2="-22" y2="110" stroke="#9CA3AF"/>
      <line x1="-10" y1="110" x2="20"  y2="110" stroke="#E8572A"/>
      <line x1="-34" y1="134" x2="-22" y2="134" stroke="#9CA3AF"/>
      <line x1="-10" y1="134" x2="34"  y2="134" stroke="#E8572A"/>
      <line x1="-34" y1="158" x2="-22" y2="158" stroke="#9CA3AF"/>
      <line x1="-10" y1="158" x2="14"  y2="158" stroke="#E8572A"/>
    </g>
  </g>

  <line x1="710" y1="112" x2="790" y2="112" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- 4. Chunks: the page cut into overlapping blocks -->
  <g transform="translate(875,0)">
    <rect x="-56" y="38"  width="98" height="56" rx="10" fill="#FDE7DF" stroke="#E8572A" stroke-width="6"/>
    <rect x="-42" y="84"  width="98" height="56" rx="10" fill="#FCF1CF" stroke="#E0A800" stroke-width="6"/>
    <rect x="-56" y="130" width="98" height="56" rx="10" fill="#E1EDFB" stroke="#4A90E2" stroke-width="6"/>
    <g stroke="#1F2937" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <line x1="-42" y1="58"  x2="24" y2="58"/>
      <line x1="-28" y1="104" x2="38" y2="104"/>
      <line x1="-28" y1="120" x2="20" y2="120"/>
      <line x1="-42" y1="150" x2="24" y2="150"/>
      <line x1="-42" y1="166" x2="6"  y2="166"/>
    </g>
  </g>

  <line x1="960" y1="112" x2="1040" y2="112" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- 5. Embeddings: vectors from the origin -->
  <g transform="translate(1125,0)">
    <path d="M-55,40 V180 H65" fill="none" stroke="#1F2937" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke-width="7" stroke-linecap="round">
      <line x1="-55" y1="180" x2="-30" y2="58"  stroke="#E8572A" marker-end="url(#vecO)"/>
      <line x1="-55" y1="180" x2="22"  y2="88"  stroke="#E0A800" marker-end="url(#vecG)"/>
      <line x1="-55" y1="180" x2="50"  y2="148" stroke="#4A90E2" marker-end="url(#vecB)"/>
    </g>
  </g>

  <line x1="1210" y1="112" x2="1290" y2="112" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- 6. Vector search: magnifying glass over results -->
  <g transform="translate(1380,0)">
    <circle cx="-12" cy="100" r="52" fill="#FFF4EF" stroke="#1F2937" stroke-width="12"/>
    <g stroke="#E8572A" stroke-width="7" stroke-linecap="round">
      <line x1="-38" y1="84"  x2="14" y2="84"/>
      <line x1="-38" y1="101" x2="4"  y2="101"/>
      <line x1="-38" y1="118" x2="10" y2="118"/>
    </g>
    <line x1="26" y1="140" x2="64" y2="180" stroke="#1F2937" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- labels -->
  <g font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">
    <text x="125"  y="250">Discovery</text>
    <text x="375"  y="250" fill="#E8572A">(Audio</text>
    <text x="375"  y="284" fill="#E8572A">Download)</text>
    <text x="625"  y="250">Transcripts</text>
    <text x="875"  y="250">Chunks</text>
    <text x="1125" y="250">Embeddings</text>
    <text x="1375" y="250">Vector Search</text>
  </g>
</svg>
