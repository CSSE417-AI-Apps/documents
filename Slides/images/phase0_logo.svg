<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Podcast microphone with sound waves -->
  <g transform="translate(150,0)">
    <g stroke-linecap="round" stroke-width="7">
      <line x1="-112" y1="105" x2="-112" y2="145" stroke="#1F2937"/>
      <line x1="-96"  y1="85"  x2="-96"  y2="165" stroke="#E8572A"/>
      <line x1="-80"  y1="70"  x2="-80"  y2="180" stroke="#1F2937"/>
      <line x1="-64"  y1="95"  x2="-64"  y2="155" stroke="#E8572A"/>
      <line x1="112" y1="105" x2="112" y2="145" stroke="#1F2937"/>
      <line x1="96"  y1="85"  x2="96"  y2="165" stroke="#E8572A"/>
      <line x1="80"  y1="70"  x2="80"  y2="180" stroke="#1F2937"/>
      <line x1="64"  y1="95"  x2="64"  y2="155" stroke="#E8572A"/>
    </g>
    <rect x="-30" y="30" width="60" height="115" rx="30" fill="#E8572A"/>
    <g fill="#FFFFFF">
      <rect x="-14" y="50" width="6" height="22" rx="3"/>
      <rect x="-3"  y="50" width="6" height="22" rx="3"/>
      <rect x="8"   y="50" width="6" height="22" rx="3"/>
    </g>
    <path d="M-46,110 A46,46 0 0 0 46,110" fill="none" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="156" x2="0" y2="196" stroke="#1F2937" stroke-width="8"/>
    <line x1="-30" y1="198" x2="30" y2="198" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- arrow -->
  <line x1="285" y1="120" x2="345" y2="120" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- Vector database cylinder -->
  <g transform="translate(450,0)" fill="none" stroke="#E0A800" stroke-width="10" stroke-linecap="round">
    <ellipse cx="0" cy="50" rx="62" ry="20"/>
    <path d="M-62,50 V190 A62,20 0 0 0 62,190 V50"/>
    <path d="M-62,97 A62,20 0 0 0 62,97"/>
    <path d="M-62,144 A62,20 0 0 0 62,144"/>
  </g>
  <!-- a few "vectors" floating out of the database -->
  <g fill="#E8572A">
    <circle cx="530" cy="62" r="5"/>
    <circle cx="545" cy="84" r="4"/>
    <circle cx="526" cy="98" r="3"/>
  </g>

  <!-- arrow -->
  <line x1="555" y1="120" x2="615" y2="120" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- Search: magnifying glass -->
  <g transform="translate(740,0)">
    <circle cx="-12" cy="105" r="55" fill="#FFF4EF" stroke="#1F2937" stroke-width="12"/>
    <g stroke="#E8572A" stroke-width="7" stroke-linecap="round">
      <line x1="-40" y1="88"  x2="16" y2="88"/>
      <line x1="-40" y1="106" x2="6"  y2="106"/>
      <line x1="-40" y1="124" x2="12" y2="124"/>
    </g>
    <line x1="28" y1="146" x2="70" y2="190" stroke="#1F2937" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- labels -->
  <g font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">
    <text x="150" y="258">Podcasts</text>
    <text x="450" y="258">Vector Database</text>
    <text x="740" y="258">Search</text>
  </g>
</svg>
