<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 380" width="1300" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Budget (coin) -->
  <g transform="translate(150,160)">
    <circle r="66" fill="#E0A800"/>
    <circle r="50" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <text y="26" text-anchor="middle" font-size="76" font-weight="bold" fill="#FFFFFF">$</text>
  </g>
  <text x="150" y="275" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Budget</text>
  <text x="150" y="307" text-anchor="middle" font-size="22" fill="#6B7280">$10 a month</text>

  <line x1="235" y1="160" x2="385" y2="160" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>
  <text x="310" y="138" text-anchor="middle" font-size="19" fill="#6B7280">cost so far,</text>
  <text x="310" y="196" text-anchor="middle" font-size="19" fill="#6B7280">a few times a day</text>

  <!-- Pub/Sub (envelope) -->
  <g transform="translate(480,160)">
    <rect x="-72" y="-48" width="144" height="96" rx="12" fill="#9CA3AF"/>
    <path d="M-66,-40 L0,10 L66,-40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <text x="480" y="275" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Pub/Sub</text>
  <text x="480" y="307" text-anchor="middle" font-size="22" fill="#6B7280" font-family="Menlo, monospace">budget-alerts</text>

  <line x1="568" y1="160" x2="715" y2="160" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>

  <!-- stop_billing (power symbol) -->
  <g transform="translate(810,160)">
    <rect x="-70" y="-70" width="140" height="140" rx="24" fill="#4A90E2"/>
    <path d="M-24,-22 A34,34 0 1 0 24,-22" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="-42" x2="0" y2="2" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="810" y="275" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937" font-family="Menlo, monospace">stop_billing</text>
  <text x="810" y="307" text-anchor="middle" font-size="22" fill="#6B7280">cost ≥ 80% of budget?</text>

  <line x1="898" y1="160" x2="1045" y2="160" stroke="#9CA3AF" stroke-width="8" marker-end="url(#head)"/>
  <text x="970" y="138" text-anchor="middle" font-size="19" fill="#6B7280">yes</text>

  <!-- Card, unlinked -->
  <g transform="translate(1140,160)">
    <rect x="-78" y="-50" width="156" height="100" rx="12" fill="#E8572A"/>
    <rect x="-78" y="-28" width="156" height="20" fill="#1F2937"/>
    <rect x="-58" y="14" width="50" height="12" rx="6" fill="#FFFFFF"/>
    <line x1="-86" y1="62" x2="86" y2="-62" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <line x1="-86" y1="62" x2="86" y2="-62" stroke="#1F2937" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="1140" y="275" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">Billing unlinked</text>
  <text x="1140" y="307" text-anchor="middle" font-size="22" fill="#6B7280">back to free Spark limits</text>
</svg>
